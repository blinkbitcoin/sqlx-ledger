#@ def site_docker_host_job(site, name, image_resource, params, workload_timeout_minutes, on_failure=None):
#@ check_docker_host_site(site)
#@ if type(workload_timeout_minutes) != "int" or workload_timeout_minutes < 1 or workload_timeout_minutes > 999:
#@   assert.fail("workload_timeout_minutes must be an integer from 1 to 999")
#@ end
#@ pool = "docker-host-" + site
#@ params = dict(params)
#@ params["REPO_PATH"] = data.values.gh_repository + "-" + name
#@ params["GOOGLE_CREDENTIALS"] = "((staging-gcp-creds.creds_json))"
#@ params["SSH_PRIVATE_KEY"] = "((staging-ssh.ssh_private_key))"
#@ params["WORKLOAD_TIMEOUT_MINUTES"] = str(workload_timeout_minutes)
name: #@ name
serial: true
plan:
#! Fetch inputs before claiming: a failed get after the acquire has no ensure
#! and would hold the claim.
- in_parallel:
  - { get: repo, trigger: true }
  - { get: pipeline-tasks }
- put: #@ pool
  params: { acquire: true }
- task: #@ name
  attempts: 1
  #! More than the sum of every bounded transport step around the workload.
  timeout: #@ str(workload_timeout_minutes + 25) + "m"
  #! The tasks read the claim from a fixed input name, whatever the site.
  input_mapping: #@ {"docker-host": pool}
  config:
    platform: linux
    image_resource: #@ image_resource
    inputs:
    - name: pipeline-tasks
    - name: docker-host
    - name: repo
      path: #@ params["REPO_PATH"]
    outputs:
    - name: host-cleanup
    params: #@ params
    run:
      path: pipeline-tasks/ci/vendor/tasks/ssh-host-run.sh
  ensure:
    do:
    - task: check-host-cleanup
      input_mapping: #@ {"docker-host": pool}
      config:
        platform: linux
        image_resource: #@ image_resource
        inputs:
        - name: pipeline-tasks
        - name: docker-host
        - name: host-cleanup
          optional: true
        run:
          path: bash
          args: [pipeline-tasks/ci/vendor/tasks/ssh-host-check-cleanup.sh]
    - put: #@ pool
      params:
        release: #@ pool
#@ if on_failure != None:
on_failure: #@ on_failure
#@ end
#@ end

