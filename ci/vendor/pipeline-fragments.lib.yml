#! Docker hosts. Without site, docker_host_pool, run_on_nix_host and
#! test_on_docker_host render the GCP pool and tasks as before. With
#! site="site1" they use that site's SSH Docker hosts instead; see
#! docs/ssh-docker-hosts.md. Site jobs run once per claim on untagged workers
#! and release the host only after a confirmed remote cleanup; otherwise the
#! claim is kept as quarantine.

